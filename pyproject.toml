[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmic-voxtype"
dynamic = ["version"]
description = "Private, local voice typing for the COSMIC desktop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "dbus-next>=0.2.3,<1",
]

[project.optional-dependencies]
inference = ["pywhispercpp>=1.4,<2"]

[project.scripts]
voxtype = "voxtype.cli:main"
voxtype-ctl = "voxtype.control:toggle"

[tool.hatch.version]
path = "src/voxtype/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voxtype"]
